name: Publish Android APK

on:
  push:
    branches: [release/apk-20261028-9e8bf30e]
    paths: ['.github/workflows/publish-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-card-center-apk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_TAG: v1.0-card-center-20261028-9e8bf30e
      APK_NAME: card-center-v1.0-20261028.apk
      APK_SHA256: 9e8bf30e183663b615ae44ea8c74e5892b0b4257ef6aabf868a717d56b846a9a
    steps:
      - name: Download the existing public APK
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 300 \
            'https://drive.usercontent.google.com/download?id=1-EqnuinT38LPWGYSZAYTu7NV1GkfGMtd&export=download&confirm=t' \
            --output "$RUNNER_TEMP/$APK_NAME"

      - name: Verify APK integrity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$APK_SHA256" "$RUNNER_TEMP/$APK_NAME" | sha256sum --check -
          python3 - "$RUNNER_TEMP/$APK_NAME" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = set(apk.namelist())
              assert 'AndroidManifest.xml' in names and 'classes.dex' in names
          print('Android APK structure verified')
          PY

      - name: Publish the verified APK as a release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$APP_TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq "$APK_NAME"; then
            mkdir -p "$RUNNER_TEMP/existing-apk"
            gh release download "$APP_TAG" --pattern "$APK_NAME" --dir "$RUNNER_TEMP/existing-apk"
            printf '%s  %s\n' "$APK_SHA256" "$RUNNER_TEMP/existing-apk/$APK_NAME" | sha256sum --check -
            if [ "$(gh release view "$APP_TAG" --json isDraft --jq '.isDraft')" = true ]; then
              gh release edit "$APP_TAG" --draft=false --latest
            fi
            echo 'The matching APK is already published; no assets were overwritten.'
            exit 0
          fi

          if ! gh release view "$APP_TAG" >/dev/null 2>&1; then
            gh release create "$APP_TAG" --draft --target "$SOURCE_COMMIT" \
              --title 'CARD CENTER v1.0 (2026-10-28)' \
              --notes 'Android 7.0+. Download the attached APK to install CARD CENTER. SHA-256: 9e8bf30e183663b615ae44ea8c74e5892b0b4257ef6aabf868a717d56b846a9a'
          fi

          draft=$(gh release view "$APP_TAG" --json isDraft --jq '.isDraft')
          gh release upload "$APP_TAG" "$RUNNER_TEMP/$APK_NAME"
          if [ "$draft" = true ]; then
            gh release edit "$APP_TAG" --draft=false --latest
          fi
